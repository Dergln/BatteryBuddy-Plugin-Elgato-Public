<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BatteryBuddy Battery</title>
  <style>
    body {
      color: #e6e6e6;
      font: 13px system-ui, sans-serif;
      margin: 0;
      padding: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select {
      box-sizing: border-box;
      width: 100%;
    }

    #status {
      color: #a7a7a7;
      line-height: 1.4;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <label id="device-label" for="device">BatteryBuddy device</label>
  <select id="device" disabled>
    <option value="">Waiting for BatteryBuddy...</option>
  </select>
  <div id="status" role="status" aria-live="polite">Connecting to BatteryBuddy.</div>
  <script>
    let websocket;
    let pluginUuid;
    let actionUuid;
    let settings = {};
    let selectedDeviceId = "";
    let devices = [];
    let connectionStatus = "disconnected";
    let localization = {};

    const deviceSelect = document.getElementById("device");
    const status = document.getElementById("status");

    const translate = (key) => Object.hasOwn(localization, key) ? localization[key] : key;

    async function loadLocalization(language) {
      const locale = typeof language === "string" ? language.replace("-", "_") : "en";
      const supported = ["de", "es", "fr", "ja", "ko", "zh_CN", "zh_TW"];
      const selected = supported.includes(locale) ? locale : "en";
      document.documentElement.lang = selected.replace("_", "-");
      if (selected === "en") {
        return;
      }

      try {
        localization = await new Promise((resolve, reject) => {
          // Stream Deck loads inspectors from local files, so use XHR rather than fetch.
          const request = new XMLHttpRequest();
          request.open("GET", `../${selected}.json`);
          request.timeout = 5000;
          request.onload = () => {
            try {
              if (request.status !== 0 && request.status !== 200) {
                throw new Error(`Localization HTTP status ${request.status}`);
              }
              const strings = JSON.parse(request.responseText).Localization;
              if (!strings || typeof strings !== "object" || Array.isArray(strings)
                  || Object.values(strings).some((value) => typeof value !== "string")) {
                throw new Error("Invalid localization resource");
              }
              resolve(strings);
            } catch (error) {
              reject(error);
            }
          };
          request.onerror = () => reject(new Error("Unable to read localization resource"));
          request.ontimeout = () => reject(new Error("Localization resource timed out"));
          request.send();
        });
      } catch (error) {
        console.error(`Unable to load ${selected} localization; using English.`, error);
        document.documentElement.lang = "en";
      }
    }

    async function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
      await loadLocalization(JSON.parse(info).application?.language);
      document.title = translate("BatteryBuddy device");
      document.getElementById("device-label").textContent = translate("BatteryBuddy device");
      deviceSelect.options[0].textContent = translate("Waiting for BatteryBuddy...");
      status.textContent = translate("Connecting to BatteryBuddy.");
      pluginUuid = uuid;
      const action = JSON.parse(actionInfo);
      actionUuid = action.action;
      settings = action.payload?.settings ?? {};
      selectedDeviceId = settings.deviceId ?? "";
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid: pluginUuid }));
      };
      websocket.onmessage = (message) => {
        const data = JSON.parse(message.data);
        if (data.event === "sendToPropertyInspector") {
          updateDeviceList(data.payload);
        } else if (data.event === "didReceiveSettings") {
          settings = data.payload?.settings ?? {};
          selectedDeviceId = settings.deviceId ?? "";
          render();
        }
      };
      deviceSelect.addEventListener("change", () => {
        selectedDeviceId = deviceSelect.value;
        settings = { ...settings, deviceId: selectedDeviceId };
        sendCommand("setSettings", settings);
      });
      websocket.onerror = () => {
        status.textContent = translate("Unable to connect to Stream Deck. Reopen this key's settings.");
        deviceSelect.disabled = true;
      };
      websocket.onclose = () => {
        status.textContent = translate("Disconnected from Stream Deck. Reopen this key's settings.");
        deviceSelect.disabled = true;
      };
    }

    function sendCommand(event, payload) {
      if (websocket?.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({
          event,
          action: actionUuid,
          // Inspector commands use its registration UUID, not actionInfo.context.
          context: pluginUuid,
          payload
        }));
      } else {
        status.textContent = translate("Unable to save the selection: Stream Deck is disconnected. Reopen this key's settings.");
        deviceSelect.disabled = true;
      }
    }

    function updateDeviceList(payload) {
      if (payload?.type !== "devices" || !Array.isArray(payload.devices)) {
        return;
      }

      devices = payload.devices;
      connectionStatus = payload.status;
      render();
    }

    function render() {
      deviceSelect.replaceChildren();
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = translate(devices.length ? "Select a device" : "No devices available");
      deviceSelect.append(placeholder);

      for (const device of devices) {
        const option = document.createElement("option");
        option.value = device.id;
        const category = device.category === "InternalBattery" ? "Internal battery" : device.category;
        option.textContent = `${device.name} (${translate(category)})`;
        deviceSelect.append(option);
      }

      if (selectedDeviceId && !devices.some((device) => device.id === selectedDeviceId)) {
        const unavailable = document.createElement("option");
        unavailable.value = selectedDeviceId;
        unavailable.textContent = translate("Selected device (unavailable)");
        deviceSelect.append(unavailable);
      }
      deviceSelect.value = selectedDeviceId;
      deviceSelect.disabled = devices.length === 0;

      if (connectionStatus === "connected") {
        status.textContent = translate(devices.length ? "Choose the device to display." : "BatteryBuddy is connected but has no devices.");
      } else if (connectionStatus === "connecting") {
        status.textContent = translate("Connecting to BatteryBuddy...");
      } else if (connectionStatus === "invalid") {
        status.textContent = translate("BatteryBuddy sent data that this plugin could not use.");
      } else {
        status.textContent = translate("BatteryBuddy is not running for this Windows user.");
      }
    }
  </script>
</body>
</html>
